[package]
name = "llama-harness-mac"
version = "0.1.0"
edition = "2021"
description = "Rust/macOS port of LlamaHarness"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.7"
directories = "5.0"
futures-util = "0.3"
http-body-util = "0.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
sha2 = "0.10"
tempfile = "3.12"
tokio = { version = "1.39", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "mock-llama-server"
path = "src/bin/mock-llama-server.rs"
